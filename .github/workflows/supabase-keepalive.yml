name: Supabase Keepalive

on:
  schedule:
    # Run daily at 03:17 UTC (outside the top-of-hour load spike).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Forks do not receive the upstream repository's secrets.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets are not configured; skipping keepalive."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            "$SUPABASE_URL/rest/v1/Capture?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
