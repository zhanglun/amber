name: Supabase Keepalive

on:
  schedule:
    # Run daily at 03:17 UTC (outside the top-of-hour load spike).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # Forks do not have the upstream repository's secrets, so this job is
    # skipped unless the two project-specific secrets are configured.
    if: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          curl --fail-with-body --silent --show-error
          --max-time 30
          "$SUPABASE_URL/rest/v1/"
          -H "apikey: $SUPABASE_ANON_KEY"
          -H "Authorization: Bearer $SUPABASE_ANON_KEY"
